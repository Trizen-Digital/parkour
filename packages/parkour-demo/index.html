<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Trizen parkour</title>
		<style>
			/* The loading screen, here so it shows before the page's script and styles arrive. */
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0b0d10;
			}

			#loading {
				position: fixed;
				inset: 0;
				z-index: 50;
				display: grid;
				place-items: center;
				background: #0b0d10;
				color: #fff;
				font: 600 clamp(13px, 0.99vw, 19px) / 1.3 'Barlow', ui-sans-serif, system-ui, sans-serif;
				transition: opacity 250ms ease;
			}

			#loading.done {
				opacity: 0;
				pointer-events: none;
			}

			#loading .middle {
				display: grid;
				justify-items: center;
				gap: 1.4em;
			}

			#loading .title {
				font-size: 4em;
				font-weight: 700;
				letter-spacing: 0.04em;
			}

			#loading .bar {
				width: 22em;
				max-width: calc(100vw - 32px);
				height: 4px;
				background: rgba(255, 255, 255, 0.12);
				overflow: hidden;
			}

			#loading .bar div {
				width: 0;
				height: 100%;
				background: #f47c34;
				transition: width 200ms linear;
			}

			#loading .status {
				position: absolute;
				right: 2.95em;
				bottom: 2.4em;
				display: flex;
				align-items: center;
				gap: 0.7em;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}

			#loading .status i {
				width: 1em;
				height: 1em;
				border-radius: 50%;
				border: 2px solid rgba(255, 255, 255, 0.2);
				border-top-color: #f47c34;
				animation: spin 0.8s linear infinite;
			}

			#loading.failed .status {
				left: 2.95em;
				text-transform: none;
				letter-spacing: 0;
				color: #ffb545;
			}

			#loading.failed .status i,
			#loading.failed .bar {
				display: none;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<div id="ui"></div>

		<div id="loading">
			<div class="middle">
				<div class="title">Parkour</div>
				<div class="bar"><div id="loading-bar"></div></div>
			</div>
			<div class="status"><i></i><span id="loading-text">Loading</span></div>
		</div>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
